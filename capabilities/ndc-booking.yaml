naftiko: 1.0.0-alpha2
info:
  label: United Airlines NDC API — Booking
  description: 'United Airlines NDC API — Booking. 3 operations. Lead operation: Create Booking. Self-contained Naftiko capability
    covering one United Airlines business surface.'
  tags:
  - United Airlines
  - Booking
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UNITED_AIRLINES_API_KEY: UNITED_AIRLINES_API_KEY
capability:
  consumes:
  - type: http
    namespace: ndc-booking
    baseUri: https://api.united.com/v1
    description: United Airlines NDC API — Booking business capability. Self-contained, no shared references.
    resources:
    - name: bookings
      path: /bookings
      operations:
      - name: createbooking
        method: POST
        description: Create Booking
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listbookings
        method: GET
        description: List Bookings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter bookings by status
        - name: departureDate
          in: query
          type: string
          description: Filter by departure date (YYYY-MM-DD)
    - name: bookings-bookingId
      path: /bookings/{bookingId}
      operations:
      - name: getbooking
        method: GET
        description: Get Booking
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bookingId
          in: path
          type: string
          description: Unique booking identifier (PNR/record locator)
          required: true
    authentication:
      type: bearer
      token: '{{env.UNITED_AIRLINES_API_KEY}}'
  exposes:
  - type: rest
    namespace: ndc-booking-rest
    port: 8080
    description: REST adapter for United Airlines NDC API — Booking. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/bookings
      name: bookings
      description: REST surface for bookings.
      operations:
      - method: POST
        name: createbooking
        description: Create Booking
        call: ndc-booking.createbooking
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listbookings
        description: List Bookings
        call: ndc-booking.listbookings
        with:
          status: rest.status
          departureDate: rest.departureDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/bookings/{bookingid}
      name: bookings-bookingid
      description: REST surface for bookings-bookingId.
      operations:
      - method: GET
        name: getbooking
        description: Get Booking
        call: ndc-booking.getbooking
        with:
          bookingId: rest.bookingId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ndc-booking-mcp
    port: 9090
    transport: http
    description: MCP adapter for United Airlines NDC API — Booking. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-booking
      description: Create Booking
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ndc-booking.createbooking
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-bookings
      description: List Bookings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ndc-booking.listbookings
      with:
        status: tools.status
        departureDate: tools.departureDate
      outputParameters:
      - type: object
        mapping: $.
    - name: get-booking
      description: Get Booking
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ndc-booking.getbooking
      with:
        bookingId: tools.bookingId
      outputParameters:
      - type: object
        mapping: $.
