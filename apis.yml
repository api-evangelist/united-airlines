name: United Airlines
description: United Airlines is a major American airline headquartered in Chicago,
  Illinois. It operates one of the largest route networks in the world with hubs in
  Chicago, Denver, Houston, Los Angeles, New York, San Francisco, and Washington,
  D.C. United provides NDC (New Distribution Capability) APIs for flight shopping,
  booking, and servicing, as well as corporate travel integration capabilities.
