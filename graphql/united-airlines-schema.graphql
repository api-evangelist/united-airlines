  DEAF_OR_HARD_OF_HEARING
  COGNITIVE_ASSISTANCE
  OXYGEN
  STRETCHER
  UNACCOMPANIED_MINOR
}

enum AssistanceStatus {
  REQUESTED
  CONFIRMED
  IN_PROGRESS
  COMPLETED
}

enum WheelchairType {
  MANUAL
  POWER_DRY_CELL
  POWER_LITHIUM
  SCOOTER
}
